[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssd-id-validator"
version = "0.1.0"
description = "Knowledge-based SSD NVMe Identify validation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "ruamel.yaml>=0.18,<1",
    "typer>=0.12,<1",
]

[project.scripts]
ssd-validator = "ssd_validator.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssd_validator*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
